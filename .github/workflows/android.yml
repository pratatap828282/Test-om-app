name: OM Investing Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"

      - name: Extract OM Investing source
        run: |
          mkdir -p _om_source

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: OM Investing source ZIP not found."
            exit 1
          fi

          echo "Using source package: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d _om_source

      - name: Locate Android project
        run: |
          GRADLEW=$(find _om_source -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Android Gradle project not found in source ZIP."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$GRADLEW")
          ANDROID_DIR=$(cd "$ANDROID_DIR" && pwd)

          chmod +x "$ANDROID_DIR/gradlew"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $ANDROID_DIR"

      - name: Run Android tests
        run: |
          cd "$ANDROID_DIR"
          ./gradlew test

      - name: Build debug APK
        run: |
          cd "$ANDROID_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: om-investing-debug-apk
          path: _om_source/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
